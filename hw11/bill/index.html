<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор счёта</title>
  <style>
    body {
      max-width: 520px;
      margin: 40px auto;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #222;
      background: #f4f5f7;
    }

    main {
      padding: 24px;
      border-radius: 12px;
      background: white;
    }

    label {
      display: block;
      margin: 16px 0 6px;
    }

    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      cursor: pointer;
    }

    #message.error { color: #c62828; }

    body.dark {
      color: #f2f2f2;
      background: #202124;
    }

    body.dark main { background: #303134; }
  </style>
</head>
<body>
  <main>
    <h1>Счёт в кафе</h1>

    <label for="bill">Сумма счёта</label>
    <input id="bill" type="number" min="0" step="1" placeholder="Например, 12000">

    <label for="people">Количество человек</label>
    <input id="people" type="number" min="1" step="1" value="1">

    <label for="tip">Чаевые</label>
    <select id="tip">
      <option value="0">0%</option>
      <option value="0.05">5%</option>
      <option value="0.1">10%</option>
      <option value="0.15">15%</option>
    </select>

    <p id="message" aria-live="polite">Введите сумму счёта.</p>
    <p>Итого с чаевыми: <span id="total">—</span> ₸</p>
    <p>С каждого: <span id="perPerson">—</span> ₸</p>

    <button id="themeButton" type="button">Тёмная тема</button>
  </main>
  <script type="module" src="./bill.js"></script>
</body>
</html>
