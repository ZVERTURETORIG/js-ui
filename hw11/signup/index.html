<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись на курс</title>
  <style>
    body { max-width: 520px; margin: 40px auto; padding: 0 20px; font-family: Arial, sans-serif; color: #20252b; }
    label { display: block; margin: 16px 0 6px; }
    input:not([type="checkbox"]), button { box-sizing: border-box; width: 100%; padding: 10px; font-size: 16px; }
    .agreement { display: flex; align-items: center; gap: 8px; }
    #message.error { color: #b42318; }
    #message.success { color: #18794e; }
    button { margin-top: 14px; cursor: pointer; }
    button:disabled { cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>Запись на курс</h1>
    <form id="signupForm" novalidate>
      <label for="name">Имя</label>
      <input id="name" type="text" autocomplete="name">

      <label for="phone">Телефон</label>
      <input id="phone" type="tel" autocomplete="tel" placeholder="+7 700 000 00 00">

      <label for="age">Возраст</label>
      <input id="age" type="number" min="1" step="1">

      <label class="agreement" for="agreement">
        <input id="agreement" type="checkbox">
        Согласен с правилами Академии
      </label>

      <p id="message" aria-live="polite"></p>
      <button id="submitButton" type="submit" disabled>Записаться</button>
    </form>
  </main>
  <script type="module" src="./signup.js"></script>
</body>
</html>
