<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Каталог товаров</h1>

    <div class="filters">
      <label>
        Поиск по названию
        <input id="search" type="search" placeholder="Например, телефон">
      </label>

      <label>
        Категория
        <select id="category">
          <option value="">Все категории</option>
        </select>
      </label>
    </div>

    <p id="message" aria-live="polite"></p>
    <section id="products" class="products" aria-label="Товары"></section>
  </main>

  <script type="module" src="catalog.js"></script>
</body>
</html>
